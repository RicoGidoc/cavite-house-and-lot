<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rico Gidoc Realty Hub</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      text-align: center;
      padding: 25px;
    }

    nav {
      background: #0f172a;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav a {
      text-decoration: none;
      color: white;
      background: #2563eb;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* ===== MARQUEE ===== */
    .marquee {
      background: #16a34a;
      color: white;
      overflow: hidden;
      padding: 10px;
      font-weight: bold;
    }

    .marquee p {
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 18s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* =======================
       🔥 CAROUSEL FIX
    ======================= */

    .carousel-wrapper {
      width: 100%;
      padding: 15px 10px;
    }

    .carousel-container {
      width: 100%;
      height: 420px;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .carousel-track a {
      min-width: 100%;
      height: 100%;
      display: block;
    }

    .slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* DOTS */
    .toggle-switch {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      background: #cbd5e1;
      cursor: pointer;
    }

    .dot.active {
      background: #1e3a8a;
    }

    /* =======================
       PROPERTY CARDS
    ======================= */

    .property-container {
      width: 92%;
      max-width: 1100px;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .property-image {
      flex: 1;
      min-width: 280px;
    }

    .property-image img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    .property-details {
      flex: 1;
      min-width: 280px;
    }

    .property-details h2 {
      color: #1e3a8a;
      margin-bottom: 10px;
    }

    .inquire-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
    }

    /* =======================
       DESKTOP 35% LAYOUT FIX
    ======================= */

    @media (min-width: 1024px) {
      body {
        width: 35%;
        margin: auto;
        background: #dbe4f0;
      }

      .carousel-container {
        height: 380px;
      }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      body {
        width: 100%;
      }

      .carousel-container {
        height: 240px;
      }
    }

  </style>
</head>

<body>

<header>
  <h2>👉 WELCOME TO RICO PROPERTY HUB 🏡</h2>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Properties</a>
  <a href="#">Promo</a>
  <a href="#">Contact</a>
</nav>

<div class="marquee">
  <p>🔥 PROMO TODAY - EXTRA LOT AREA + LOW DOWNPAYMENT + FLEXIBLE TERMS 🔥</p>
</div>

<!-- ================= CAROUSEL ================= -->
<div class="carousel-wrapper">
  <div class="carousel-container">
    <div class="carousel-track">

      <a href="promo.html"><img src="./k5.png" class="slide"></a>
      <a href="promo.html"><img src="./phirst.png" class="slide"></a>
      <a href="promo.html"><img src="./victoria/vc1.png" class="slide"></a>
      <a href="promo.html"><img src="./zelia/houseimage.png" class="slide"></a>
      <a href="promo.html"><img src="./liora/liora.jpg" class="slide"></a>
      <a href="promo.html"><img src="./kat5/k1.png" class="slide"></a>
      <a href="promo.html"><img src="./verdiana/1.jpg" class="slide"></a>
      <a href="promo.html"><img src="./paseoverde/1.png" class="slide"></a>

    </div>
  </div>

  <div class="toggle-switch">
    <button class="dot active"></button>
    <button class="dot"></button>
    <button class="dot"></button>
    <button class="dot"></button>
    <button class="dot"></button>
    <button class="dot"></button>
    <button class="dot"></button>
    <button class="dot"></button>
  </div>
</div>

<script>
  let index = 0;
  const track = document.querySelector(".carousel-track");
  const slides = document.querySelectorAll(".slide");
  const dots = document.querySelectorAll(".dot");

  function update() {
    track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach(d => d.classList.remove("active"));
    dots[index].classList.add("active");
  }

  function goToSlide(i) {
    index = i;
    update();
  }

  setInterval(() => {
    index++;
    if (index >= slides.length) index = 0;
    update();
  }, 3000);
</script>

</body>
</html>
