<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rico Gidoc Realty Hub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      text-align: center;
      padding: 25px;
    }

    nav {
      background: #0f172a;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
    }

    nav a {
      color: white;
      text-decoration: none;
      background: #2563eb;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* ================= MARQUEE ================= */
    .marquee {
      background: #16a34a;
      color: white;
      overflow: hidden;
      padding: 10px;
      font-weight: bold;
    }

    .marquee p {
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 18s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* ================= CAROUSEL FIX ================= */

    .carousel-wrapper {
      width: 100%;
      padding: 15px 10px;
    }

    .carousel-container {
      width: 100%;
      height: 420px;
      overflow: hidden;   /* 🔥 IMPORTANT FIX */
      border-radius: 16px;
      background: #000;
      position: relative;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
    }

    /* 🔥 FORCE EXACT ONE SLIDE ONLY */
    .carousel-track a {
      min-width: 100%;
      height: 100%;
      flex-shrink: 0;
      display: block;
    }

    .slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ================= DOTS ================= */

    .toggle-switch {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cbd5e1;
      border: none;
      cursor: pointer;
    }

    .dot.active {
      background: #1e3a8a;
    }

    /* ================= DESKTOP 35% ================= */

    @media (min-width: 1024px) {
      body {
        width: 35%;
        margin: auto;
        background: #dbe4f0;
      }

      .carousel-container {
        height: 380px;
      }
    }

    /* ================= MOBILE ================= */

    @media (max-width: 768px) {
      body {
        width: 100%;
      }

      .carousel-container {
        height: 240px;
      }
    }

  </style>
</head>

<body>

<header>
  <h2>👉 WELCOME TO RICO PROPERTY HUB 🏡</h2>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Properties</a>
  <a href="#">Promo</a>
  <a href="#">Contact</a>
</nav>

<div class="marquee">
  <p>🔥 PROMO TODAY - EXTRA LOT AREA + LOW DOWNPAYMENT + FLEXIBLE TERMS 🔥</p>
</div>

<!-- ================= CAROUSEL ================= -->
<div class="carousel-wrapper">

  <div class="carousel-container">
    <div class="carousel-track">

      <a href="promo.html"><img src="./k5.png" class="slide"></a>
      <a href="promo.html"><img src="./phirst.png" class="slide"></a>
      <a href="promo.html"><img src="./victoria/vc1.png" class="slide"></a>
      <a href="promo.html"><img src="./zelia/houseimage.png" class="slide"></a>
      <a href="promo.html"><img src="./liora/liora.jpg" class="slide"></a>
      <a href="promo.html"><img src="./kat5/k1.png" class="slide"></a>
      <a href="promo.html"><img src="./verdiana/1.jpg" class="slide"></a>
      <a href="promo.html"><img src="./paseoverde/1.png" class="slide"></a>

    </div>
  </div>

  <div class="toggle-switch">
    <button class="dot active" onclick="goToSlide(0)"></button>
    <button class="dot" onclick="goToSlide(1)"></button>
    <button class="dot" onclick="goToSlide(2)"></button>
    <button class="dot" onclick="goToSlide(3)"></button>
    <button class="dot" onclick="goToSlide(4)"></button>
    <button class="dot" onclick="goToSlide(5)"></button>
    <button class="dot" onclick="goToSlide(6)"></button>
    <button class="dot" onclick="goToSlide(7)"></button>
  </div>

</div>

<script>
  let index = 0;
  const track = document.querySelector(".carousel-track");
  const slides = document.querySelectorAll(".slide");
  const dots = document.querySelectorAll(".dot");

  function update() {
    track.style.transform = `translateX(-${index * 100}%)`;

    dots.forEach(d => d.classList.remove("active"));
    if (dots[index]) dots[index].classList.add("active");
  }

  function goToSlide(i) {
    index = i;
    update();
  }

  setInterval(() => {
    index++;
    if (index >= slides.length) index = 0;
    update();
  }, 3000);
</script>

</body>
</html>
